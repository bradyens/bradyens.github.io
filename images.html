<!DOCTYPE HTML>
<html>
    <head>
        <title>Images</title>
        <style>
            body {
                background: #84cacfe7;
                color: #47d42f;
                font-family: 'Creepster', Arial, sans-serif;
                font-size: 20px;
                margin: 0;
                padding: 0;
                padding-top: 40px
            }
            #all-contents {
                max-width: 1200px;
                margin: 0 auto;
                padding: 0 24px;
            }
            nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 48px;
  padding: 17px 24px;
  background: #5789a7e7;
  border: 3px solid #e4e39c;
  border-radius: 12px;
  font-family: verdana;
            }
            h1 {
  margin: 0;
  font-size: 1.3rem;
  font-weight: 700;
  text-transform: lowercase;
  letter-spacing: 0.2em;
  color: #e4e39c;
            }
            #nav-ul {
  list-style: none;
  display: flex;
  gap: 8px;
  margin: 0;
  padding: 0;
            }
            .nav-li {
  color: #e4e39c;
  text-decoration: none;
  font-size: 1rem;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 8px;
  transition:
    background 0.25s ease,
    color 0.25s ease;
            }
            #navanchor {
  color: #e4e39c;
  text-decoration: none;
  font-size: 1rem;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 8px;
  transition:
    background 0.25s ease,
    color 0.25s ease;
            }
            #navanchor:hover {
  background: #494518;
  color: #fffbc4;
            }
            .image-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 32px;
                margin-top: 32px;
            }
            .image-item {
                
                transition: transform 0.2s;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
            }
            .image-item img {
                max-width: 100%;
                max-height: 320px;
                border-radius: 12px;
                background: #ffffff;
                border: 4px solid #e4e39c;
                transition: box-shadow 0.2s, border-color 0.2s, transform 0.2s;
            }
            .image-item img:hover {
                border-color: #e4e39c;
                transform: scale(1.08);
                border-width: 8px;
            }
            @media (max-width: 900px) {
                .image-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
            @media (max-width: 600px) {
                .image-grid {
                    grid-template-columns: 1fr;
                }
            }
    </style>
    </head>
    
    <body>
        <div id="all-contents">
            <nav>
                <h1>b r a d y e n s 1 s t w e b s i t e</h1>
                <ul id="nav-ul">
                    <li class="nav-li">
                        <a id="navanchor" href="index.html">Home</a>
                    </li>
                    <li class="nav-li">
                        <a id="navanchor" href="portfolio.html">Portfolio</a>
                        </li>
                    <li class="nav-li"><a id="navanchor" href="images.html">Images</a>
                    </li>
                    
                </ul>
            </nav>
                <div class="image-grid">
                    <div class="image-item"><img src="assets/IMG_3328.JPG" alt="IMG_3328"></div>
                    
                    <div class="image-item"><img src="assets/IMG_3329.JPG" ></div>
                    <div class="image-item"><img src="assets/IMG_3337.JPG" ></div>
                    <div class="image-item"><img src="assets/IMG_3340.JPG" ></div>
                    <div class="image-item"><img src="assets/IMG_3341.JPG" ></div>
                </div>
                <!-- Modal for full-size image -->
                <div id="imageModal" class="modal">
                    <span class="close">&times;</span>
                    <span class="modal-arrow left">&#10094;</span>
                    <img class="modal-content" id="modalImg" alt="Full Size">
                    <span class="modal-arrow right">&#10095;</span>
                </div>
    </body>
      
      
      
      
      
      
      
        <script>
        // Modal logic with navigation
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImg');
        const closeBtn = document.querySelector('.close');
        const leftArrow = document.querySelector('.modal-arrow.left');
        const rightArrow = document.querySelector('.modal-arrow.right');
        const images = Array.from(document.querySelectorAll('.image-item img'));
        let currentIndex = 0;

        function showModal(index) {
            currentIndex = index;
            modal.style.display = 'block';
            modalImg.src = images[index].src;
            modalImg.alt = images[index].alt;
        }

        images.forEach((img, idx) => {
            img.addEventListener('click', function() {
                showModal(idx);
            });
        });

        closeBtn.onclick = function() {
            modal.style.display = 'none';
            modalImg.src = '';
        }

        leftArrow.onclick = function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showModal(currentIndex);
        }

        rightArrow.onclick = function(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % images.length;
            showModal(currentIndex);
        }

        window.onclick = function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
                modalImg.src = '';
            }
        }

        window.addEventListener('keydown', function(e) {
            if (modal.style.display === 'block') {
                if (e.key === 'ArrowLeft') {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                    showModal(currentIndex);
                } else if (e.key === 'ArrowRight') {
                    currentIndex = (currentIndex + 1) % images.length;
                    showModal(currentIndex);
                } else if (e.key === 'Escape') {
                    modal.style.display = 'none';
                    modalImg.src = '';
                }
            }
        });
        </script>
        <style>
            .modal {
                display: none;
                position: fixed;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100vw;
                height: 100vh;
                overflow: auto;
                animation: fadeIn 0.3s;
            }
            .modal-content {
                display: block;
                margin: 5vh auto;
                max-width: 90vw;
                max-height: 80vh;
                border-radius: 18px;
                box-shadow: 0 8px 32px 0 #494518;
                background: #ffffff;
                border: 6px solid #e4e39c;
                animation: scaleUp 0.3s;
            }
            .close {
                position: absolute;
                top: 32px;
                right: 48px;
                color: #5789a7e7;
                font-size: 48px;
                font-weight: 300;
                cursor: pointer;
                z-index: 1001;
                transition: color 0.2s;
            }
            .close:hover {
                color: #fff;
            }
            .modal-arrow {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                color: #5789a7e7;
                font-size: 64px;
                font-weight: 300;
                cursor: pointer;
                z-index: 1001;
                user-select: none;
                padding: 0 24px;
                transition: color 0.2s;
            }
            .modal-arrow.left {
                left: 0;
            }
            .modal-arrow.right {
                right: 0;
            }
            .modal-arrow:hover {
                color: #fff;
            }
            @keyframes fadeIn {
                from { opacity: 0; }
                to { opacity: 1; }
            }
            @keyframes scaleUp {
                from { transform: scale(0.95); }
                to { transform: scale(1); }
            }
        </style>
</html>
